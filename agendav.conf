<VirtualHost *:8080>
	DocumentRoot /var/www/agendav/public
	ServerName ${AGENDAV_SERVER_NAME}
	ErrorLog ${APACHE_LOG_DIR}/davi-error.log
	LogLevel warn
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	<Directory /var/www/agendav/public>
		AllowOverride FileInfo AuthConfig Limit Options=FollowSymLinks
		Require all granted
	</Directory>
	<Location />
		RewriteEngine On
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^ index.php [QSA,L]
	</Location>
</VirtualHost>
